# Save as: .github/workflows/metrics.yml  (in your Dmwinzi/Dmwinzi profile repo)
name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ---- Full 3-column panel, modelled on the screenshot ----
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Dmwinzi
          template: classic
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: UTC                 # change to yours, e.g. Africa/Nairobi
          config_display: columns              # gives the 3-column layout in the screenshot
          config_padding: 0, 8 + 11%

          # Middle column: repo stats (releases, packages, disk usage, lines added/removed)
          plugin_lines: yes
          repositories_forks: no

          # Middle column: "Coding habits and recent activity"
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Middle column: "Mastered technologies and topics"
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 24

          # Right column: 3D contributions calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Right column: most used languages bar
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Right column: PageSpeed scores. Uses the website on your GitHub profile.
          # Delete these two lines if you have no website set.
          plugin_pagespeed: yes
          plugin_pagespeed_detailed: no

          # ---- Optional, need extra setup (uncomment when ready) ----
          # Projects board (create a GitHub Project first, then use owner/repo/number):
          # plugin_projects: yes
          # plugin_projects_repositories: Dmwinzi/Dmwinzi/1
          #
          # Suggested tracks (needs a music provider, see the plugin docs):
          # plugin_music: yes
          # plugin_music_provider: spotify
          # plugin_music_mode: recent
          # plugin_music_token: ${{ secrets.SPOTIFY_TOKEN }}

      # ---- Second panel: achievements + notable contributions ----
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Dmwinzi
          template: classic
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
          plugin_notable: yes
          plugin_notable_repositories: yes
