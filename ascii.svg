  .k { fill: #00ff41; }
  .d { fill: #1f6b35; }
  .v { fill: #d1fae5; }
  .cur { fill: #00ff41; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
